name: Update IPTV Playlist

on:
  # Run automatically every day at 6:00 AM UTC
  schedule:
    - cron: "0 6 * * *"

  # Also let us run it manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate playlist
        run: python generate.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
         git add playlist.m3u playlist-v2.m3u
          git diff --cached --quiet || git commit -m "Update IPTV playlist"
          git push
