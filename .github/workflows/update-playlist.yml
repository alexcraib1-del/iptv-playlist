name: Update IPTV Playlist

on:
  # Run automatically every day at 6:00 AM UTC
  schedule:
    - cron: "0 6 * * *"

  # Also let us run it manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate playlist
        run: python generate.py

      - name: Build EPG channel list
        run: python generate_epg.py

      - name: Clone IPTV-org EPG
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg-grabber
          cp channels.xml epg-grabber/channels.xml

      - name: Install EPG dependencies
        working-directory: epg-grabber
        run: npm install

      - name: Generate guide
        working-directory: epg-grabber
        run: |
          npm run grab --- \
            --channels=channels.xml \
            --output=../guide.xml \
            --days=1 \
            --maxConnections=5

      - name: Normalize EPG IDs
        run: python normalize_epg.py
      
      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
           git add playlist.m3u playlist-v2.m3u channels.xml guide.xml stream-health.json dead-streams.txt
          git diff --cached --quiet || git commit -m "Update IPTV playlist"
          git push
